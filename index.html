<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#030014" />
    <title>AI Research Papers - Weekly Top 20</title>
    <style>
      :root {
        --bg: #030014;
        --text: rgba(255, 255, 255, 0.92);
        --muted: rgba(148, 163, 184, 0.92);
        --border: rgba(255, 255, 255, 0.12);
        --glass: rgba(255, 255, 255, 0.06);
        --accent: #a78bfa;
      }

      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }

      body {
        font-family: ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial, "Apple Color Emoji",
          "Segoe UI Emoji";
        background: radial-gradient(circle at 50% 50%, #1e1b4b 0%, #030014 56%, #020012 100%);
        color: var(--text);
        padding: 36px 18px 80px;
      }

      .wrap {
        max-width: 1200px;
        margin: 0 auto;
      }

      header {
        display: flex;
        align-items: flex-end;
        justify-content: space-between;
        gap: 12px;
        flex-wrap: wrap;
        padding: 10px 0 18px;
        border-bottom: 1px solid rgba(255, 255, 255, 0.08);
      }

      h1 {
        font-size: 24px;
        letter-spacing: 0;
      }

      .subtitle {
        color: var(--muted);
        font-size: 14px;
        line-height: 1.6;
        margin-top: 6px;
      }

      .controls {
        display: flex;
        gap: 10px;
        flex-wrap: wrap;
        align-items: center;
      }

      input,
      select {
        height: 38px;
        border-radius: 8px;
        background: rgba(255, 255, 255, 0.05);
        border: 1px solid rgba(255, 255, 255, 0.1);
        color: var(--text);
        padding: 0 12px;
        outline: none;
      }

      input::placeholder {
        color: rgba(148, 163, 184, 0.75);
      }

      input:focus,
      select:focus,
      button:focus-visible {
        border-color: rgba(167, 139, 250, 0.45);
        box-shadow: 0 0 0 4px rgba(167, 139, 250, 0.12);
      }

      .nav-link,
      button {
        min-height: 38px;
        border-radius: 8px;
        border: 1px solid rgba(255, 255, 255, 0.1);
        background: rgba(255, 255, 255, 0.05);
        color: var(--accent);
        cursor: pointer;
        font: inherit;
        font-size: 14px;
        padding: 8px 12px;
      }

      .nav-link {
        display: inline-flex;
        align-items: center;
        text-decoration: none;
      }

      .status {
        margin-top: 14px;
        color: var(--muted);
        font-size: 13px;
      }

      .grid {
        margin-top: 18px;
        display: grid;
        grid-template-columns: 1fr;
        gap: 16px;
      }

      .card {
        padding: 18px;
        border-radius: 8px;
        background: var(--glass);
        border: 1px solid var(--border);
        backdrop-filter: blur(10px);
        content-visibility: auto;
        contain-intrinsic-size: 320px;
      }

      .topline {
        display: flex;
        justify-content: space-between;
        gap: 10px;
        align-items: flex-start;
        flex-wrap: wrap;
      }

      .title {
        margin-top: 12px;
        font-size: 18px;
        font-weight: 650;
        letter-spacing: 0;
        line-height: 1.3;
      }

      .authors {
        margin-top: 8px;
        color: var(--muted);
        font-size: 14px;
      }

      .abstract {
        margin-top: 12px;
        color: var(--muted);
        font-size: 14px;
        line-height: 1.6;
      }

      .chips {
        display: flex;
        gap: 8px;
        flex-wrap: wrap;
      }

      .chip {
        display: inline-flex;
        min-height: 24px;
        padding: 3px 10px;
        border-radius: 999px;
        border: 1px solid rgba(255, 255, 255, 0.12);
        background: rgba(255, 255, 255, 0.03);
        font-size: 12px;
        align-items: center;
      }

      .date {
        color: var(--muted);
        font-size: 13px;
        margin-top: 8px;
      }

      .links {
        margin-top: 12px;
        display: flex;
        gap: 12px;
        flex-wrap: wrap;
      }

      a {
        color: var(--accent);
        text-decoration: none;
        font-size: 14px;
      }

      a:hover,
      button:hover {
        text-decoration: underline;
      }

      .empty {
        margin-top: 18px;
        padding: 18px;
        border-radius: 8px;
        background: rgba(255, 255, 255, 0.04);
        border: 1px solid rgba(255, 255, 255, 0.1);
      }

      .score {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        width: 32px;
        height: 32px;
        border-radius: 8px;
        background: rgba(167, 139, 250, 0.15);
        border: 1px solid rgba(167, 139, 250, 0.3);
        font-size: 13px;
        font-weight: 600;
        color: var(--accent);
      }

      .infographic {
        margin-top: 16px;
        padding: 14px;
        border-radius: 8px;
        background: rgba(167, 139, 250, 0.06);
        border: 1px solid rgba(167, 139, 250, 0.15);
      }

      .infographic-toggle {
        display: inline-flex;
        align-items: center;
        gap: 8px;
        padding: 0;
        min-height: auto;
        border: 0;
        background: transparent;
        color: var(--accent);
        font-weight: 600;
      }

      .infographic-content {
        margin-top: 12px;
      }

      .infographic h4 {
        font-size: 13px;
        font-weight: 650;
        margin-top: 12px;
        margin-bottom: 6px;
        color: var(--text);
      }

      .infographic h4:first-child {
        margin-top: 0;
      }

      .infographic p,
      .infographic ul {
        font-size: 13px;
        line-height: 1.6;
        color: var(--muted);
      }

      .infographic ul {
        margin: 6px 0;
        padding-left: 20px;
      }

      .hashtags {
        display: flex;
        gap: 8px;
        flex-wrap: wrap;
        margin-top: 8px;
      }

      .hashtag {
        font-size: 12px;
        color: var(--accent);
      }

      .load-more-wrap {
        display: flex;
        justify-content: center;
        margin-top: 18px;
      }

      #loadMore[hidden] {
        display: none;
      }

      @media (max-width: 768px) {
        body {
          padding: 24px 12px 64px;
        }

        h1 {
          font-size: 20px;
        }

        .title {
          font-size: 16px;
        }

        input,
        select,
        .nav-link {
          width: 100%;
        }
      }
    </style>
  </head>
  <body>
    <div class="wrap">
      <header>
        <div>
          <h1>AI Research Papers - Weekly Top 20</h1>
          <p class="subtitle">Latest AI research from arXiv, Nature, Science, and more</p>
        </div>

        <div class="controls">
          <input id="q" placeholder="Search papers..." size="28" />
          <select id="cat">
            <option value="all">All categories</option>
          </select>
          <select id="source">
            <option value="all">All sources</option>
          </select>
          <a class="nav-link" href="archives.html">Archives</a>
        </div>
      </header>

      <div id="status" class="status">Loading papers...</div>

      <div id="empty" class="empty" hidden>
        <div style="font-weight: 650">No papers found.</div>
        <div class="subtitle" style="margin-top: 6px">
          Run the collection and generation scripts to populate the database.
        </div>
      </div>

      <div id="grid" class="grid"></div>
      <div class="load-more-wrap">
        <button id="loadMore" type="button" hidden>Load more</button>
      </div>
    </div>

    <script>
      const INITIAL_BATCH_SIZE = 20
      const NEXT_BATCH_SIZE = 40

      const grid = document.querySelector('#grid')
      const empty = document.querySelector('#empty')
      const status = document.querySelector('#status')
      const q = document.querySelector('#q')
      const cat = document.querySelector('#cat')
      const source = document.querySelector('#source')
      const loadMore = document.querySelector('#loadMore')

      const assetPrefix = location.pathname.includes('/static/') ? '../' : './'
      const papersUrl = new URL(`${assetPrefix}papers.json`, document.baseURI).toString()
      const infographicCache = new Map()

      let allPapers = []
      let filteredPapers = []
      let renderedCount = 0

      function uniq(xs) {
        return Array.from(new Set(xs))
      }

      function stripHtml(html) {
        const tmp = document.createElement('div')
        tmp.innerHTML = html
        return tmp.textContent || tmp.innerText || ''
      }

      function clearChildren(node) {
        while (node.firstChild) node.removeChild(node.firstChild)
      }

      function setStatus() {
        const shown = Math.min(renderedCount, filteredPapers.length)
        status.textContent = filteredPapers.length
          ? `Showing ${shown} of ${filteredPapers.length} papers`
          : `${allPapers.length} papers loaded`
        loadMore.hidden = renderedCount >= filteredPapers.length
      }

      function appendTextBlock(parent, heading, text) {
        if (!text) return
        const h4 = document.createElement('h4')
        h4.textContent = heading
        const p = document.createElement('p')
        p.textContent = text
        parent.append(h4, p)
      }

      function renderInfographicContent(content, infographic) {
        clearChildren(content)

        appendTextBlock(content, 'Key Insight', infographic.key_insight)
        appendTextBlock(content, 'Problem Solved', infographic.problem_solved)

        if (Array.isArray(infographic.method) && infographic.method.length) {
          const h4 = document.createElement('h4')
          h4.textContent = 'Method'
          const ul = document.createElement('ul')
          for (const item of infographic.method) {
            const li = document.createElement('li')
            li.textContent = item
            ul.appendChild(li)
          }
          content.append(h4, ul)
        }

        appendTextBlock(content, 'Impact', infographic.impact)

        if (Array.isArray(infographic.hashtags) && infographic.hashtags.length) {
          const hashtags = document.createElement('div')
          hashtags.className = 'hashtags'
          for (const tag of infographic.hashtags) {
            const span = document.createElement('span')
            span.className = 'hashtag'
            span.textContent = tag
            hashtags.appendChild(span)
          }
          content.appendChild(hashtags)
        }
      }

      async function loadInfographic(paperId) {
        if (infographicCache.has(paperId)) return infographicCache.get(paperId)

        const fileUrl = new URL(`${assetPrefix}infographics/${paperId}_infographic.json`, document.baseURI).toString()
        const response = await fetch(fileUrl, { cache: 'force-cache' })
        if (!response.ok) return null

        const infographic = await response.json()
        infographicCache.set(paperId, infographic)
        return infographic
      }

      function createInfographicSection(paperId) {
        const section = document.createElement('div')
        section.className = 'infographic'

        const toggle = document.createElement('button')
        toggle.type = 'button'
        toggle.className = 'infographic-toggle'
        toggle.setAttribute('aria-expanded', 'false')
        toggle.textContent = 'View AI-generated summary'

        const content = document.createElement('div')
        content.className = 'infographic-content'
        content.hidden = true

        toggle.addEventListener('click', async () => {
          const expanded = toggle.getAttribute('aria-expanded') === 'true'
          if (expanded) {
            content.hidden = true
            toggle.setAttribute('aria-expanded', 'false')
            toggle.textContent = 'View AI-generated summary'
            return
          }

          content.hidden = false
          toggle.setAttribute('aria-expanded', 'true')
          toggle.textContent = 'Hide AI-generated summary'

          if (content.dataset.loaded) return
          content.dataset.loaded = 'true'
          content.textContent = 'Loading summary...'

          try {
            const infographic = await loadInfographic(paperId)
            if (infographic) {
              renderInfographicContent(content, infographic)
            } else {
              content.textContent = 'Summary is not available for this paper yet.'
            }
          } catch (error) {
            console.warn(`Failed to load infographic for ${paperId}`, error)
            content.textContent = 'Summary could not be loaded.'
          }
        })

        section.append(toggle, content)
        return section
      }

      function createPaperCard(paper) {
        const card = document.createElement('article')
        card.className = 'card'

        const topline = document.createElement('div')
        topline.className = 'topline'

        const chips = document.createElement('div')
        chips.className = 'chips'

        for (const label of [paper.category, paper.source].filter(Boolean)) {
          const chip = document.createElement('span')
          chip.className = 'chip'
          chip.textContent = label
          chips.appendChild(chip)
        }

        const score = document.createElement('div')
        score.className = 'score'
        score.textContent = paper.score || '0'
        score.title = 'Relevance score'

        topline.append(chips, score)

        const date = document.createElement('div')
        date.className = 'date'
        date.textContent = paper.date || ''

        const title = document.createElement('div')
        title.className = 'title'
        title.textContent = paper.title || 'Untitled'

        const authors = document.createElement('div')
        authors.className = 'authors'
        authors.textContent = paper.authors || 'Unknown'

        const abstract = document.createElement('div')
        abstract.className = 'abstract'
        abstract.textContent = stripHtml(paper.abstract || '')

        const links = document.createElement('div')
        links.className = 'links'
        if (Array.isArray(paper.links)) {
          for (const link of paper.links) {
            const a = document.createElement('a')
            a.href = link.url
            a.textContent = link.title || 'Link'
            a.target = '_blank'
            a.rel = 'noreferrer'
            links.appendChild(a)
          }
        }

        card.append(topline, date, title, authors)
        if (paper.abstract) card.appendChild(abstract)
        if (links.children.length) card.appendChild(links)
        if (paper.id) card.appendChild(createInfographicSection(paper.id))

        return card
      }

      function renderNextBatch(size) {
        const nextItems = filteredPapers.slice(renderedCount, renderedCount + size)
        for (const paper of nextItems) {
          grid.appendChild(createPaperCard(paper))
        }
        renderedCount += nextItems.length
        empty.hidden = filteredPapers.length !== 0
        setStatus()
      }

      function applyFilters() {
        const query = q.value.trim().toLowerCase()
        const catValue = cat.value
        const sourceValue = source.value

        filteredPapers = allPapers.filter((paper) => {
          const matchQuery =
            !query ||
            (paper.title || '').toLowerCase().includes(query) ||
            (paper.abstract || '').toLowerCase().includes(query) ||
            (paper.authors || '').toLowerCase().includes(query)

          const matchCat = catValue === 'all' || paper.category === catValue
          const matchSource = sourceValue === 'all' || paper.source === sourceValue
          return matchQuery && matchCat && matchSource
        })

        renderedCount = 0
        clearChildren(grid)
        renderNextBatch(INITIAL_BATCH_SIZE)
      }

      function debounce(fn, delay) {
        let timer
        return () => {
          clearTimeout(timer)
          timer = setTimeout(fn, delay)
        }
      }

      async function main() {
        try {
          const response = await fetch(papersUrl, { cache: 'no-store' })
          const json = await response.json()
          allPapers = Array.isArray(json) ? json : []
          filteredPapers = allPapers

          for (const value of uniq(allPapers.map((paper) => paper.category).filter(Boolean)).sort()) {
            const option = document.createElement('option')
            option.value = value
            option.textContent = value
            cat.appendChild(option)
          }

          for (const value of uniq(allPapers.map((paper) => paper.source).filter(Boolean)).sort()) {
            const option = document.createElement('option')
            option.value = value
            option.textContent = value
            source.appendChild(option)
          }

          q.addEventListener('input', debounce(applyFilters, 150))
          cat.addEventListener('change', applyFilters)
          source.addEventListener('change', applyFilters)
          loadMore.addEventListener('click', () => renderNextBatch(NEXT_BATCH_SIZE))

          renderNextBatch(INITIAL_BATCH_SIZE)
        } catch (error) {
          console.error(error)
          status.textContent = 'Unable to load papers.'
          empty.hidden = false
        }
      }

      main()
    </script>
  </body>
</html>
